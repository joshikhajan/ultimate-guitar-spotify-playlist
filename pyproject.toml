[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ug-spotify-playlist"
version = "0.1.0"
description = "Create an ordered Spotify playlist from an Ultimate Guitar favorites CSV export."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["spotipy>=2.25,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
ug-spotify-playlist = "ug_spotify.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
